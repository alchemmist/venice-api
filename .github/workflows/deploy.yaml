name: Publish and deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: venice-api-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Contract tests
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests -v

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: harbor.socrat.alchemmist.xyz
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: harbor.socrat.alchemmist.xyz/homelab/venice-api:${{ github.sha }}

      - name: Deploy to Socrat
        uses: alchemmist/deploy-to-socrat@v1
        with:
          token: ${{ secrets.HOMELAB_DEPLOY_KEY }}
          app: venice-api
          image_version: ${{ steps.image.outputs.digest }}
